version: '3.8'

services:
  # API Gateway
  gateway:
    build:
      context: ./Gateways/Challenge.Gateways.ApiGateway
      dockerfile: Dockerfile
    container_name: gateway
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      DOTNET_RUNNING_IN_CONTAINER: true
    ports:
      - "5000:8080"
    depends_on:
      - rider
      - motorbike
      - subscription
    networks:
      - app_network

  # Rider API
  rider:
    build:
      context: ./Microservices/Challenge.Microservices.RiderApi
      dockerfile: Dockerfile
    container_name: rider
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORTS: 8080
    ports:
      - "5001:8080"
    depends_on:
      - rider-database
      - rider-storage
    networks:
      - app_network
      - rider_network

  # Motorbike API
  motorbike:
    build:
      context: ./Microservices/Challenge.Microservices.MotorbikeApi
      dockerfile: Dockerfile
    container_name: motorbike
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORTS: 8080
    ports:
      - "5002:8080"
    depends_on:
      - motorbike-database
      - rabbitmq
    networks:
      - app_network
      - motorbike_network

  # Subscription API
  subscription:
    build:
      context: ./Microservices/Challenge.Microservices.SubscriptionApi
      dockerfile: Dockerfile
    container_name: subscription
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORTS: 8080
    ports:
      - "5003:8080"
    depends_on:
      - subscription-database
      - rider
    networks:
      - app_network
      - subscription_network

  # MongoDB for Rider
  rider-database:
    image: mongo:latest
    container_name: rider-database
    ports:
      - "27017:27017"
    volumes:
      - rider-db-data:/data/db
    networks:
      - rider_network

  # MongoDB for Motorbike
  motorbike-database:
    image: mongo:latest
    container_name: motorbike-database
    ports:
      - "27018:27017"
    volumes:
      - motorbike-db-data:/data/db
    networks:
      - motorbike_network

  # MongoDB for Subscription
  subscription-database:
    image: mongo:latest
    container_name: subscription-database
    ports:
      - "27019:27017"
    volumes:
      - subscription-db-data:/data/db
    networks:
      - subscription_network

  # RabbitMQ
  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    ports:
      - "5672:5672"   # AMQP port
      - "15672:15672" # Management UI
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    networks:
      - app_network
      - motorbike_network

  # MinIO - S3 storage for Rider
  rider-storage:
    image: minio/minio:latest
    container_name: rider-storage
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      - rider_network

  # MinIO setup
  rider-storage-setup:
    image: minio/mc:latest
    container_name: rider-storage-setup
    depends_on:
      rider-storage:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      sleep 5;
      echo 'Setting up MinIO...';
      /usr/bin/mc alias set myminio http://rider-storage:9000 minioadmin minioadmin;
      echo 'Creating bucket rider-bucket...';
      /usr/bin/mc mb myminio/rider-bucket --ignore-existing;
      echo 'Setting public download policy...';
      /usr/bin/mc anonymous set download myminio/rider-bucket;
      echo 'MinIO setup completed successfully!';
      exit 0;
      "
    networks:
      - rider_network

networks:
  app_network:
    driver: bridge
  rider_network:
    driver: bridge
  motorbike_network:
    driver: bridge
  subscription_network:
    driver: bridge

volumes:
  rider-db-data:
    driver: local
  motorbike-db-data:
    driver: local
  subscription-db-data:
    driver: local
  rabbitmq-data:
    driver: local
  minio-data:
    driver: local